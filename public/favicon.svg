<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1e3a8a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Network / ODP distribution paths -->
  <g filter="url(#glow)">
    <!-- Connection lines -->
    <path d="M256 160 L256 310" stroke="#ffffff" stroke-width="20" stroke-linecap="round" opacity="0.95" />
    <path d="M256 260 L140 370" stroke="#ffffff" stroke-width="20" stroke-linecap="round" opacity="0.95" />
    <path d="M256 260 L372 370" stroke="#ffffff" stroke-width="20" stroke-linecap="round" opacity="0.95" />

    <!-- Central Node (ODP Hub) -->
    <rect x="206" y="110" width="100" height="100" rx="24" fill="#ffffff" />
    <rect x="226" y="130" width="60" height="60" rx="14" fill="url(#accent)" />
    <!-- Status indicator LED -->
    <circle cx="256" cy="160" r="12" fill="#ffffff" />

    <!-- Terminal Nodes (FTTH Clients) -->
    <!-- Center bottom node -->
    <circle cx="256" cy="360" r="42" fill="#ffffff" />
    <circle cx="256" cy="360" r="26" fill="#3b82f6" />
    <circle cx="256" cy="360" r="10" fill="#ffffff" />

    <!-- Left node -->
    <circle cx="140" cy="370" r="42" fill="#ffffff" />
    <circle cx="140" cy="370" r="26" fill="url(#accent)" />
    <circle cx="140" cy="370" r="10" fill="#ffffff" />

    <!-- Right node -->
    <circle cx="372" cy="370" r="42" fill="#ffffff" />
    <circle cx="372" cy="370" r="26" fill="url(#accent)" />
    <circle cx="372" cy="370" r="10" fill="#ffffff" />
  </g>
</svg>